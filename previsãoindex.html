<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do Tempo</title>

    <link rel="stylesheet" href="previsao style.css">
</head>

<body>

    <div id="painel">

        <!-- CABEÇALHO -->
        <div class="cabecalho">
            <div class="titulo">PREVISÃO DO TEMPO</div>

            <div class="data">
                Hoje<br>
                Porto Alegre - RS
            </div>
        </div>

        <!-- CARDS DO CLIMA -->
        <div class="grade">

            <!-- Temperatura -->
            <div class="card temperatura">
                <div class="icone">sol</div>
                <div class="nome">Temperatura</div>
                <div class="valor">26°C</div>
            </div>

            <!-- Umidade -->
            <div class="card umidade">
                <div class="icone">agua</div>
                <div class="nome">Umidade</div>
                <div class="valor">65%</div>
            </div>

            <!-- Vento -->
            <div class="card vento">
                <div class="icone">frio</div>
                <div class="nome">Vento</div>
                <div class="valor">12 km/h</div>
            </div>

            <!-- Condição -->
            <div class="card condicao">
                <div class="icone">nuvem</div>
                <div class="nome">Condição</div>
                <div class="valor">Ensolarado</div>
            </div>

            <!-- Amanhã -->
            <div class="card amanha">
                <div class="icone">dia</div>
                <div class="nome">Amanhã</div>
                <div class="valor">25°C</div>
            </div>

            <!-- Localização -->
            <div class="card localizacao">
                <div class="icone">localizacao</div>
                <div class="nome">Localização</div>
                <div class="valor">Porto Alegre</div>
            </div>

        </div>

    </div>

</body>
</html>
